<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="../../assets/img/favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Олюшин | Достижения студентов</title>
  <link rel="stylesheet" href="../../assets/css/styles.css?v=20260911g" />
</head>

<body>
  <header class="header">
    <div class="container">
      <div class="navbar">
        <a class="brand" href="../../index.html">Портфолио</a>

        <div class="nav-actions">
          <button class="burger" data-burger aria-label="Меню" aria-expanded="false">
            ☰ <span class="burger-label">Меню</span>
          </button>
        </div>

        <nav class="nav" data-nav>
          <a href="../../index.html">Главная страница</a>
          <a href="../education.html">Образование</a>
          <a href="../work-experience.html">Опыт работы</a>
          <div class="dropdown" data-dropdown>
            <button type="button" class="active" data-dropdown-btn aria-haspopup="true" aria-expanded="false">
              Достижения ▾
            </button>
            <div class="dropdown-panel">
              <a href="teacher.html">Преподавателя</a>
              <a class="active" href="students.html">Студентов</a>
            </div>
          </div>

          <a href="../student-works.html">Работы студентов</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Достижения студентов</h1>
    <p class="subtitle">
      Сертификаты, благодарности, дипломы и подтверждения результатов
    </p>

    <section class="section">
      <div class="gallery-controls" data-gallery-controls data-gallery-target="students">
        <div class="gallery-controls__layout">
          <label class="gallery-control">
            <span>Категория</span>
            <select data-gallery-category aria-label="Категория">
              <option value="all" selected>Все награды</option>
              <option value="diplomas">Дипломы</option>
              <option value="certificates">Сертификаты</option>
              <option value="gratitude">Благодарности</option>
            </select>
          </label>
          <label class="gallery-control">
            <span>Учебный год</span>
            <select data-gallery-academic-year aria-label="Учебный год">
              <option value="all" selected>Все учебные годы</option>
            </select>
          </label>
          <label class="gallery-control">
            <span>Сортировка</span>
            <select data-gallery-sort aria-label="Сортировка">
              <option value="date-desc" selected>По дате (новые)</option>
              <option value="date-asc">По дате (старые)</option>
              <option value="name-asc">По имени (А-Я)</option>
              <option value="name-desc">По имени (Я-А)</option>
            </select>
          </label>
          <label class="gallery-control">
            <span>С даты</span>
            <input type="text" inputmode="numeric" placeholder="дд.мм.гггг" data-gallery-from />
          </label>
          <label class="gallery-control">
            <span>По дату</span>
            <input type="text" inputmode="numeric" placeholder="дд.мм.гггг" data-gallery-to />
          </label>
          <div class="gallery-controls__actions">
            <button type="button" class="btn btn--ghost" data-gallery-clear>Сброс</button>
          </div>
        </div>
      </div>

      <div class="gallery gallery--4"
           data-auto-gallery
           data-gallery-id="students"
           data-gallery-base="../../content/achievements/students"
           data-gallery-title="Диплом студента"
           data-gallery-title-certificates="Сертификат студента"
           data-gallery-title-gratitude="Благодарность студенту"
           data-gallery-category="all"
           data-gallery-sort="date-desc">
        <p class="gallery-status">Подготовка каталога…</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <nav class="footer-nav" aria-label="Навигация в подвале">
        <a href="../../index.html">Главная</a>
        <a href="../education.html">Образование</a>
        <a href="../work-experience.html">Опыт работы</a>
        <a href="index.html">Достижения</a>
        <a href="../student-works.html">Работы студентов</a>
      </nav>
      <span>&copy; 2026 Олюшин Владислав Викторович</span>
    </div>
  </footer>

  <div class="img-modal" id="imgModal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Просмотр награды">
    <div class="img-modal__dialog">
      <button class="img-modal__close" type="button" data-modal-close aria-label="Закрыть">&times;</button>
      <img class="img-modal__img" id="imgModalImg" alt="Документ" hidden />
      <iframe class="img-modal__frame" id="imgModalFrame" title="Документ" hidden></iframe>
    </div>
  </div>

  <script src="../../assets/js/main.js?v=20260911i"></script>
</body>
</html>
