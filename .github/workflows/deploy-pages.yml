name: Публикация сайта на GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка сайта
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Подготовить сайт к публикации
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Публикация сайта
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
